spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/smartstock}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: 8080

springdoc:
  swagger-ui:
    path: /swagger

  api-docs:
    path: /api-docs

app:
  security:
    jwt:
      secret: ${JWT_SECRET:smartstock-local-development-secret-key-123456789}
      expiration: ${JWT_EXPIRATION:86400000}