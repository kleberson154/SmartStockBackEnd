spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/smartstock
    username: postgres
    password: postgres

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: 8080

springdoc:
  swagger-ui:
    path: /swagger

  api-docs:
    path: /api-docs

app:
  security:
    jwt:
      secret: smartstock-super-secret-key-change-this-in-production-123456789
      expiration: 86400000